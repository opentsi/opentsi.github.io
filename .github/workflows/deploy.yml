name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    container: oven/bun:1.3.11-alpine
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy ${{ github.sha }}"
          git push --force https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:gh-pages
