name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/alpine-jellyfish/bun-alpine-git:1.3.11
    steps:
      - name: Checkout
        run: git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Astro
        run: bun run astro check || true

      - name: Build
        run: bun run build

      - name: Build summary
        run: |
          echo "Build successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "- Build size: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
